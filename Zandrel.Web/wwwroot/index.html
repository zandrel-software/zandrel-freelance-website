<!DOCTYPE html>
<html lang="es-MX">

<head>
    <meta charset="utf-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Zandrel | Desarrollo de software a medida</title>

    <meta name="description"
          content="Desarrollo de software a medida para personas, profesionales y proyectos. Páginas web, sistemas, automatizaciones, aplicaciones y soluciones personalizadas." />

    <meta name="robots"
          content="index, follow, max-image-preview:large" />

    <meta name="theme-color"
          content="#FFFAF4" />

    <base href="/" />

    <!-- Favicon -->

    <link rel="icon"
          type="image/png"
          href="images/brand/zandrel-mark-transparent.png" />

    <!-- Canonical -->

    <link rel="canonical"
          href="https://zandrel.com/" />

    <!-- Open Graph -->

    <meta property="og:type"
          content="website" />

    <meta property="og:locale"
          content="es_MX" />

    <meta property="og:site_name"
          content="Zandrel" />

    <meta property="og:title"
          content="Zandrel | Desarrollo de software a medida" />

    <meta property="og:description"
          content="Páginas web, sistemas, automatizaciones, aplicaciones y soluciones de software desarrolladas a medida para tus ideas y proyectos." />

    <meta property="og:url"
          content="https://zandrel.com/" />

    <meta property="og:image"
          content="https://zandrel.com/images/zandrel-social-preview.png" />

    <meta property="og:image:secure_url"
          content="https://zandrel.com/images/zandrel-social-preview.png" />

    <meta property="og:image:type"
          content="image/png" />

    <meta property="og:image:alt"
          content="Zandrel - Soluciones de software para tus ideas y proyectos" />

    <!-- X / Twitter -->

    <meta name="twitter:card"
          content="summary_large_image" />

    <meta name="twitter:title"
          content="Zandrel | Desarrollo de software a medida" />

    <meta name="twitter:description"
          content="Páginas web, sistemas, automatizaciones, aplicaciones y soluciones de software desarrolladas a medida para tus ideas y proyectos." />

    <meta name="twitter:image"
          content="https://zandrel.com/images/zandrel-social-preview.png" />

    <meta name="twitter:image:alt"
          content="Zandrel - Soluciones de software para tus ideas y proyectos" />

    <!-- Application -->

    <link rel="preload"
          id="webassembly" />

    <link rel="stylesheet"
          href="css/app.css" />

    <link rel="stylesheet"
          href="Zandrel.Web.styles.css" />

    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="app-loading">
            <div class="app-loading__content">
                <img class="app-loading__mark"
                     src="images/brand/zandrel-mark-transparent.png"
                     alt="Zandrel" />

                <div class="app-loading__bar"
                     role="progressbar"
                     aria-label="Cargando Zandrel">
                </div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.

        <a href="."
           class="reload">
            Recargar
        </a>

        <button class="dismiss"
                type="button"
                aria-label="Cerrar mensaje de error">
            ×
        </button>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
