name: Deploy Zandrel to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROJECT_PATH: Zandrel.Web/Zandrel.Web.csproj
  PUBLISH_DIR: ./publish/wwwroot
  BASE_HREF: /zandrel-freelance-website/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish application
        run: >
          dotnet publish
          ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-restore
          --output ./publish

      - name: Configure GitHub Pages base path
        run: |
          sed -i "s#<base href=\"/\" />#<base href=\"${BASE_HREF}\" />#" "${PUBLISH_DIR}/index.html"
          grep '<base href=' "${PUBLISH_DIR}/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5