name: Deploy Zandrel to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PROJECT_PATH: Zandrel.Web/Zandrel.Web.csproj
  PUBLISH_DIR: ./publish/wwwroot

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish application
        run: >
          dotnet publish
          ${{ env.PROJECT_PATH }}
          --configuration Release
          --no-restore
          --output ./publish

      - name: Configure GitHub Pages deployment
        shell: bash
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -e

          BASE_HREF="${BASE_PATH}/"

          echo "GitHub Pages base URL:  ${BASE_URL}"
          echo "GitHub Pages base path: ${BASE_PATH}"
          echo "Blazor base href:       ${BASE_HREF}"

          # Configure Blazor base path for the active GitHub Pages URL.
          sed -i \
            "s|<base href=\"/\" />|<base href=\"${BASE_HREF}\" />|" \
            "${PUBLISH_DIR}/index.html"

          # Configure public URLs for the active GitHub Pages URL.
          for FILE in \
            "${PUBLISH_DIR}/index.html" \
            "${PUBLISH_DIR}/robots.txt" \
            "${PUBLISH_DIR}/sitemap.xml"
          do
            if [ -f "$FILE" ]; then
              sed -i \
                "s|https://zandrel.com|${BASE_URL}|g" \
                "$FILE"
            fi
          done

          # Prevent Jekyll processing.
          touch "${PUBLISH_DIR}/.nojekyll"

          # Blazor SPA fallback for GitHub Pages.
          cp "${PUBLISH_DIR}/index.html" "${PUBLISH_DIR}/404.html"

          echo ""
          echo "Published base href:"
          grep '<base href=' "${PUBLISH_DIR}/index.html"

          echo ""
          echo "Published canonical URL:"
          grep 'rel="canonical"' -A 1 "${PUBLISH_DIR}/index.html"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5